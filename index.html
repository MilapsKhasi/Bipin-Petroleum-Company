
<!DOCTYPE html>

  <head>
    <script>
      // Fix for read-only window.fetch in some iframe / proxy environments
      try {
        let originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return originalFetch;
          },
          set(value) {
            originalFetch = value;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("Could not patch window.fetch setter:", e);
      }
    </script>

    <script>
      // Clean up any stale service workers or caches to prevent duplicate React instances or outdated chunks
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
