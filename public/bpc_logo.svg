<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="85%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bpcBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c60b0" />
      <stop offset="100%" stop-color="#074482" />
    </linearGradient>
  </defs>

  <!-- bpc text -->
  <g transform="translate(10, 122)">
    <!-- b -->
    <text x="0" y="0" fill="url(#bpcBlue)" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="bold" font-style="italic">b</text>
    <!-- p -->
    <text x="58" y="0" fill="url(#bpcBlue)" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="bold" font-style="italic">p</text>
    <!-- c -->
    <text x="126" y="0" fill="url(#bpcBlue)" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="bold" font-style="italic">c</text>
  </g>

  <!-- Stem from p to leaf -->
  <path d="M 134 68 Q 142 58 152 48" stroke="url(#bpcBlue)" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Green leaf -->
  <g transform="translate(144, 12) rotate(-5)">
    <!-- Leaf outer shape -->
    <path d="M 8 48 C 2 28, 16 8, 44 2 C 58 20, 52 42, 30 52 C 20 56, 12 54, 8 48 Z" fill="url(#leafGrad)" />
    <!-- Leaf inner white highlight -->
    <path d="M 14 42 C 20 28, 30 18, 40 10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>
</svg>
